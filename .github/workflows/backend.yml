name: Booking server
on:
  push:
    branches: [main]
    paths: ['server/**', 'shared/**', 'supabase/**', 'scripts/**', 'package-lock.json']
  workflow_dispatch:
    inputs:
      seed:
        description: 'Create the DDAM 2026/2027 course and the two December sessions as drafts (safe to repeat)'
        type: boolean
        default: false
      admin_email:
        description: 'Email allowed to use the dashboard (must also exist in Supabase Auth)'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: backend
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ] || [ -z "${{ secrets.SESSION_SECRET }}" ]; then
            echo "::warning::Supabase is not configured yet. Skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ready == 'true'
        with: { node-version: 22, cache: npm }
      - if: steps.cfg.outputs.ready == 'true'
        run: npm ci
      - name: Migrate database
        if: steps.cfg.outputs.ready == 'true'
        run: npm run db:migrate
      - name: Seed course and sessions
        if: steps.cfg.outputs.ready == 'true' && (inputs.seed || inputs.admin_email != '')
        env:
          ADMIN_EMAIL_INPUT: ${{ inputs.admin_email }}
        run: |
          if [ -n "$ADMIN_EMAIL_INPUT" ]; then npx tsx scripts/seed.ts --admin "$ADMIN_EMAIL_INPUT"; else npx tsx scripts/seed.ts; fi
      - name: Build Edge Function
        if: steps.cfg.outputs.ready == 'true'
        run: npm run build:edge
      - uses: supabase/setup-cli@v1
        if: steps.cfg.outputs.ready == 'true'
        with: { version: 3.2.0 }
      - name: Configure and deploy Edge Function
        if: steps.cfg.outputs.ready == 'true'
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          OWNER: ${{ github.repository_owner }}
          SITE_URL: ${{ vars.SITE_URL }}
          EXTRA_ORIGINS: ${{ vars.EXTRA_ORIGINS }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          ADMIN_NOTIFICATION_EMAIL: ${{ vars.ADMIN_NOTIFICATION_EMAIL }}
        run: |
          SITE="https://${OWNER,,}.github.io"
          BASE="${SITE_URL:-$SITE}"
          ORIGINS="$SITE${EXTRA_ORIGINS:+,$EXTRA_ORIGINS}"
          # Email: Brevo if its key is set, else Resend, else "console" (emails are only listed in the dashboard).
          EMAIL=(EMAIL_PROVIDER=console)
          if [ -n "$BREVO_API_KEY" ] && [ -n "$EMAIL_FROM" ]; then
            EMAIL=(EMAIL_PROVIDER=brevo BREVO_API_KEY="$BREVO_API_KEY" EMAIL_FROM="$EMAIL_FROM")
          elif [ -n "$RESEND_API_KEY" ] && [ -n "$EMAIL_FROM" ]; then
            EMAIL=(EMAIL_PROVIDER=resend RESEND_API_KEY="$RESEND_API_KEY" EMAIL_FROM="$EMAIL_FROM")
          fi
          if [ -n "$ADMIN_NOTIFICATION_EMAIL" ]; then EMAIL+=(ADMIN_NOTIFICATION_EMAIL="$ADMIN_NOTIFICATION_EMAIL"); fi
          echo "Email provider: ${EMAIL[0]#EMAIL_PROVIDER=}"
          supabase secrets set --project-ref "$PROJECT_REF" \
            SESSION_SECRET="$SESSION_SECRET" APP_BASE_URL="$BASE" ALLOWED_ORIGINS="$ORIGINS" "${EMAIL[@]}" --yes
          supabase functions deploy api --project-ref "$PROJECT_REF" --no-verify-jwt --yes
      - name: Smoke test
        if: steps.cfg.outputs.ready == 'true'
        run: curl --fail --silent --show-error "https://$PROJECT_REF.supabase.co/functions/v1/api/health"
