name: Keep-alive
# Free Supabase projects pause after about a week without database activity.
# The health endpoint runs a database query, so calling it daily keeps the project awake.
on:
  schedule:
    - cron: '17 6 * * *' # every day at 06:17 UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Ping the booking server
        run: |
          if [ -z "$PROJECT_REF" ]; then echo "::warning::SUPABASE_PROJECT_REF is not set. Skipping."; exit 0; fi
          curl --fail --silent --show-error --retry 3 --retry-delay 10 "https://$PROJECT_REF.supabase.co/functions/v1/api/health"
